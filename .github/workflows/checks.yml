# Runs on every push and pull request: the migrations match db/schema, types,
# lint, every tenant isolation check against a fresh database, and a production
# build. All secrets below are throwaway values made up for this run; no real
# service is called (emails go to .dev-emails/, files to .dev-files/, and
# Claude is replaced by fakes). A second job reports known security advisories
# in the production dependencies.
name: checks

on:
  push:
  pull_request:

# The jobs only read the code.
permissions:
  contents: read

# A newer push to the same branch stops the run still going for the older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ansa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ansa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ansa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write a throwaway .env.local
        run: |
          {
            echo "DATABASE_URL=postgres://ansa:ci-only-password@127.0.0.1:5432/ansa"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "SEND_REAL_EMAIL=false"
            echo "USE_R2_STORAGE=false"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "VAPI_WEBHOOK_SECRET=$(openssl rand -hex 32)"
            echo "RESEND_WEBHOOK_SECRET=whsec_$(openssl rand -base64 32)"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
          } > .env.local

      # db/schema and db/migrations must agree. A schema change committed
      # without `pnpm db:generate` would pass every step below (they migrate
      # the SQL that exists) and then be missing in production. WHY the text
      # test too: when drizzle-kit would have to ask (a renamed column), it
      # can't without a terminal, so it writes nothing and still exits 0.
      - name: Migrations match db/schema
        run: |
          pnpm db:generate --name schema_drift_check < /dev/null > "$RUNNER_TEMP/drift-check.log" 2>&1 || true
          if ! grep -q "No schema changes" "$RUNNER_TEMP/drift-check.log" || [ -n "$(git status --porcelain --untracked-files=all -- db/migrations)" ]; then
            grep -v "^    at " "$RUNNER_TEMP/drift-check.log" | tail -20
            echo "db/schema and db/migrations differ: run pnpm db:generate and commit the migration it writes."
            exit 1
          fi

      - run: pnpm db:migrate
      # Route types (.next/types) are generated, not committed.
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:tenant-isolation
      - run: pnpm build

  # Known high or critical advisories in what production runs (dev tools such
  # as drizzle-kit and the shadcn CLI are left out). Its own job, so a new
  # advisory shows as a failed check without hiding how the other checks went.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # This job installs nothing, so there is no pnpm store to cache:
          # setup-node v5's automatic cache would fail the job saving it.
          package-manager-cache: false
      - run: pnpm audit --prod --audit-level high
